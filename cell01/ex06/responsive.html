<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            border: 1px solid black;
            table-layout: fixed;
        }
        td {
            width: 50%;
            font-size: 18px;
            font-family: sans-serif;
            padding: 0;
        }
        td:first-child {
            border-right: 1px solid #888;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td style="background-color: #c2cb7e;">First cell</td>
            <td style="background-color: #fcae96;">Second cell</td>
        </tr>
    </table>

</body>
</html>
