<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        td {
            width: 50%;
            padding: 50px 0px;
            font-size: 18px;
            font-family: sans-serif;
        }
        td:first-child {
            border-right: 1px solid #888;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td style="background-color: #c2cb7e;">First cell</td>
            <td style="background-color: #fcae96;">Second cell</td>
        </tr>
    </table>

</body>
</html>
