<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <!-- ใช้ตารางซ่อนขอบจัดวางองค์ประกอบตามโจทย์ -->
        <table class="profile-table">
            <tr>
                <th class="card-header">
                    <h2>User Profile Card</h2>
                </th>
            </tr>
            <tr>
                <td>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtn8iTz3yvzkC3M-f2ZXdJI5oINWXXxOG2A3WwSNMr6Q&s=10" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td class="login">aumrichy</td>
            </tr>
            <tr>
                <td class="description">pls logging in</td>
            </tr>
            <tr>
                <td class="social-icons">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
